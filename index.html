<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACE.DETECT</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────── -->
<header>
  <span class="logo">FACE.DETECT</span>
  <div class="badge">
    <div class="dot blink" id="rec-dot"></div>
    <span id="rec-label">INITIALIZING</span>
  </div>
</header>

<!-- ── NAV ─────────────────────────────────────────────────────────────── -->
<nav>
  <button class="nav-btn active" data-page="single">[ SINGLE ]</button>
  <button class="nav-btn" data-page="preview">[ PREVIEW ]</button>
  <button class="nav-btn" data-page="compare" id="compare-tab" disabled>[ COMPARE ]</button>
  <button class="nav-btn" data-page="remember" id="remember-tab" disabled>[ REMEMBER ]</button>
</nav>

<!-- ── PAGE: SINGLE ────────────────────────────────────────────────────── -->
<section id="page-single" class="page active">
  <div class="cam-wrap">
    <canvas id="canvas-main"></canvas>
    <div id="overlay">
      <span class="ov-title">FACE.DETECT</span>
      <span class="ov-sub">REAL-TIME EMOTION OVERLAY</span>
      <button id="start-btn" disabled>[ START CAMERA ]</button>
      <span id="init-msg">LOADING MODEL...</span>
    </div>
  </div>

  <div class="controls">
    <label>
      <span>MASK TARGET</span>
      <select id="privacy-target">
        <option value="frontmost">FRONT FACE</option>
        <option value="remembered">REMEMBERED FACES</option>
      </select>
    </label>

    <label>
      <span>MASK STYLE</span>
      <select id="privacy-effect">
        <option value="emoji">EMOJI</option>
        <option value="blur">BLUR</option>
      </select>
    </label>

    <span id="memory-state">MEMORY EMPTY</span>
  </div>

  <div class="record-controls">
    <button id="record-btn" class="panel-btn" disabled>[ START REC ]</button>
    <span id="record-state">REC OFF</span>
  </div>
</section>

<!-- ── PAGE: PREVIEW ────────────────────────────────────────────────────── -->
<section id="page-preview" class="page">
  <div class="preview-head">
    <div>
      <div class="panel-title">// RECORDINGS</div>
      <div id="recording-summary">0 CLIPS</div>
    </div>
    <div class="preview-actions">
      <button id="export-all-btn" class="panel-btn" disabled>[ EXPORT ALL ]</button>
      <button id="clear-recordings-btn" class="panel-btn subtle" disabled>[ CLEAR ]</button>
    </div>
  </div>
  <div id="recording-list" class="recording-list"></div>
</section>

<!-- ── PAGE: COMPARE ───────────────────────────────────────────────────── -->
<section id="page-compare" class="page">
  <div class="compare-grid">

    <div class="compare-col">
      <div class="cam-wrap">
        <canvas id="canvas-left"></canvas>
      </div>
      <div class="compare-label">// RAW FEED</div>
    </div>

    <div class="compare-col">
      <div class="cam-wrap">
        <canvas id="canvas-right"></canvas>
      </div>
      <div class="compare-label">// PRIVACY FEED</div>
    </div>

  </div>
</section>

<!-- ── PAGE: REMEMBER ───────────────────────────────────────────────────── -->
<section id="page-remember" class="page">
  <div class="learn-grid">

    <div class="compare-col">
      <div class="cam-wrap">
        <canvas id="canvas-learn"></canvas>
      </div>
      <div class="compare-label">// LEARN FROM FRONT FACE</div>
    </div>

    <div class="learn-panel">
      <div class="panel-title">// FACE MEMORY</div>
      <div id="learn-status">START CAMERA FIRST</div>
      <div class="learn-meter"><div id="learn-progress"></div></div>
      <button id="learn-btn" class="panel-btn" disabled>[ LEARN FACE ]</button>
      <button id="clear-memory-btn" class="panel-btn subtle" disabled>[ CLEAR ALL ]</button>
      <div class="profile-list" id="profile-list"></div>
    </div>

  </div>
</section>

<!-- ── FOOTER ──────────────────────────────────────────────────────────── -->
<footer>
  <span id="footer-status">SYSTEM READY</span>
  <div class="footer-stats">
    <span>FACES&nbsp;<span id="s-faces">0</span></span>
    <span>FPS&nbsp;<span id="s-fps">—</span></span>
  </div>
</footer>

<video id="webcam" autoplay playsinline muted></video>

<script type="module" src="js/main.js"></script>

</body>
</html>
